name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify the committed model artifact
        run: |
          python -c "
          from app.model import SegmentationModel
          m = SegmentationModel.load()
          assert m.feature_names == ['age','annual_income_k','spending_score','purchase_frequency','avg_order_value'], m.feature_names
          assert m.n_clusters == 4, m.n_clusters
          metrics = m.metrics
          assert metrics['silhouette'] > 0.3, metrics
          assert metrics['adjusted_rand_index'] > 0.8, metrics
          print(f'Artifact OK: {m.n_clusters} clusters, {m.n_features} features, scikit-learn {m.sklearn_version}')
          print('metrics:', metrics)
          "

      - name: Run test suite
        run: python -m pytest -v

  docker:
    name: Build, smoke-test and publish image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/kritee0301/customer-segmentation-api" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name seg-api -p 8000:8000 ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait until the container reports healthy
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' seg-api 2>/dev/null || echo starting)
            echo "attempt ${attempt}: ${status}"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::container never became healthy"
          docker logs seg-api
          exit 1

      - name: Smoke test /health and /predict
        run: |
          curl -fsS http://localhost:8000/health -o health.json
          cat health.json

          python -c "
          import json
          health = json.load(open('health.json'))
          assert health['status'] == 'ok', health
          assert health['model_loaded'] is True, health
          assert health['n_clusters'] == 4, health
          print('health OK:', health['n_clusters'], 'clusters,', len(health['features']), 'features')
          "

          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":40,"annual_income_k":61.0,"spending_score":51,"purchase_frequency":13,"avg_order_value":74.0}' \
            -o predict.json

          cat predict.json

          python -c "
          import json
          prediction = json.load(open('predict.json'))
          assert prediction['segment_id'] == 2, prediction
          assert prediction['segment_name'] == 'Mainstream Families', prediction
          print('predict OK:', prediction['segment_name'], 'distance', prediction['distance_to_centroid'])
          "

      - name: Container logs
        if: always()
        run: docker logs seg-api || true

      - name: Stop the container
        if: always()
        run: docker rm -f seg-api || true

      - name: Publish image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "Published ${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Container verification"
            echo ""
            echo "Image: \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo ""
            echo "| Check | Status |"
            echo "| --- | --- |"
            echo "| Build + model smoke test | pass |"
            echo "| Container healthy | pass |"
            echo "| GET /health | pass |"
            echo "| POST /predict | pass |"
            echo "| Published to GHCR | ${{ github.event_name == 'push' && 'yes' || 'no (pull request)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-ec2:
    name: Deploy to EC2 (opt-in)
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push' && vars.ENABLE_EC2_DEPLOY == 'true'

    steps:
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/kritee0301/customer-segmentation-api" >> "$GITHUB_ENV"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull the new image and restart the container
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"

          docker pull "$IMAGE"
          docker rm -f seg-api >/dev/null 2>&1 || true
          docker run -d --name seg-api --restart unless-stopped -p 8000:8000 "$IMAGE"

          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' seg-api 2>/dev/null || echo starting)
            echo "attempt ${attempt}: ${status}"

            if [ "$status" = "healthy" ]; then
              docker ps --filter name=seg-api
              exit 0
            fi

            sleep 2
          done

          echo "container never became healthy"
          docker logs seg-api
          exit 1
          REMOTE